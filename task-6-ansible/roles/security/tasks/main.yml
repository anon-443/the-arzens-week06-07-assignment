---
- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh
- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
- name: Allow SSH
  community.general.ufw: rule=allow port=22 proto=tcp
- name: Allow HTTP
  community.general.ufw: rule=allow port=80 proto=tcp
- name: Allow HTTPS
  community.general.ufw: rule=allow port=443 proto=tcp
- name: Enable UFW
  community.general.ufw: state=enabled
- name: Enable fail2ban
  ansible.builtin.service: name=fail2ban enabled=true state=started
- name: Install audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/arzens-hardening.rules
    mode: '0640'
    content: |
      -w /etc/passwd -p wa -k identity
      -w /etc/sudoers -p wa -k privilege
      -w /var/log/auth.log -p wa -k auth
  notify: Restart auditd
